<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="styles.css" />
    <title>PIXL</title>

  <body

      <div class="flex flex-col gap-1.5 items-center text-pixl p-4">
        <p>All Rights Reserved. pixl Media For Everyone*</p>

          *except for badgers, they're $&@*holes.
        </p>
      </div>
      <!-- White noise image -->

      ></div>
    </footer>

</html>
